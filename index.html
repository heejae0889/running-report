<!DOCTYPE html>
<html lang="ko" class="snap-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>트립 런닝 · 여행지 러닝 코스 찾기</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- 폰트: Pretendard -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <!-- 첫 화면 사진은 미리 받아 두기 -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1602619075660-d0f5459cb189?auto=format&fit=crop&w=2000&q=75" />
  <!-- 공통 스타일 → 페이지 스타일 순서 유지 -->
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/index.css" rel="stylesheet" />
</head>
<body class="home">
  <header id="site-header"></header>

  <!--
    화면 구성: 화면 하나(.panel) = 스크롤 한 단계
    - 사진은 각 panel의 style 속성 --bg(PC용), --bg-sm(모바일용), --pos(사진 초점 위치)로 바꿉니다.
    - 사진 출처: Unsplash (무료 라이선스). 직접 찍은 사진으로 바꾸려면 img/ 폴더에 넣고 url(img/파일명.jpg)로 교체
  -->
  <main class="story">
    <!-- 1. 첫 화면 -->
    <section class="panel panel--hero" id="step-1" aria-label="트립 런닝"
      style="--bg:url('https://images.unsplash.com/photo-1602619075660-d0f5459cb189?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1602619075660-d0f5459cb189?auto=format&fit=crop&w=1000&q=70');
             --pos:center 62%;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy hero-copy">
        <h1 class="hero-title">트립 런닝</h1>
        <p class="hero-sub">여행지에서 달릴 길을 찾아 드려요.</p>
      </div>
    </section>

    <!-- 2. 문제 제기 -->
    <section class="panel" id="step-2"
      style="--bg:url('https://images.unsplash.com/photo-1634085398114-5091e0d9ed9e?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1634085398114-5091e0d9ed9e?auto=format&fit=crop&w=1000&q=70');
             --pos:30% center;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy">
        <h2 class="panel-title">낯선 도시에서도<br />늘 달리던 것처럼.</h2>
        <p class="panel-sub">어디서 달려야 할지 검색하느라 아침을 보내지 마세요.</p>
      </div>
    </section>

    <!-- 3. 설문 -->
    <section class="panel" id="step-3"
      style="--bg:url('https://images.unsplash.com/photo-1762697447213-9d61fbd7ef11?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1762697447213-9d61fbd7ef11?auto=format&fit=crop&w=1000&q=70');
             --pos:28% center;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy panel-copy--right">
        <h2 class="panel-title">질문 몇 개면<br />충분해요.</h2>
        <p class="panel-sub">여행지, 달리고 싶은 거리, 날짜. 그리고 좋아하는 풍경까지.</p>
      </div>
    </section>

    <!-- 4. 코스 지도 -->
    <section class="panel" id="step-4"
      style="--bg:url('https://images.unsplash.com/photo-1769284331730-9955c15e7dac?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1769284331730-9955c15e7dac?auto=format&fit=crop&w=1000&q=70');
             --pos:center 55%;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy">
        <h2 class="panel-title">달릴 길을<br />지도 위에 그려 드려요.</h2>
        <p class="panel-sub">실제 산책로를 따라, 출발부터 도착까지 한 줄로.</p>
      </div>
    </section>

    <!-- 5. 날씨·맛집·행사 -->
    <section class="panel" id="step-5"
      style="--bg:url('https://images.unsplash.com/photo-1628532431030-3b6d433ed166?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1628532431030-3b6d433ed166?auto=format&fit=crop&w=1000&q=70');
             --pos:center;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy">
        <h2 class="panel-title">다 달리고 나면,<br />그 동네의 맛까지.</h2>
        <p class="panel-sub">그날의 날씨, 도착 지점 근처 맛집, 열리는 행사를 레포트 한 장에 담아요.</p>
      </div>
    </section>

    <!-- 6. 마지막: 코스 찾기 -->
    <section class="panel panel--cta" id="step-6"
      style="--bg:url('https://images.unsplash.com/photo-1556746834-2eb6bfdc8424?auto=format&fit=crop&w=2000&q=75');
             --bg-sm:url('https://images.unsplash.com/photo-1556746834-2eb6bfdc8424?auto=format&fit=crop&w=1000&q=70');
             --pos:40% center;">
      <div class="panel-bg" aria-hidden="true"></div>
      <div class="panel-copy cta-copy">
        <h2 class="panel-title">이번 여행에선<br />어디를 달려볼까요?</h2>
        <p class="panel-sub">2분이면 나만의 러닝 레포트가 완성돼요.</p>
        <a class="btn-find" href="survey.html">코스 찾기</a>
      </div>
      <footer id="site-footer"></footer>
    </section>
  </main>

  <!-- 오른쪽: 지금 몇 번째 화면인지 보여 주는 코스 모양 표시 (점을 누르면 이동) -->
  <nav class="route-nav" aria-label="화면 이동">
    <span class="route-track" aria-hidden="true"><span class="route-fill" id="routeFill"></span></span>
    <ol class="route-stops" id="routeStops"></ol>
  </nav>

  <!-- 아래쪽: 스크롤 안내 (누르면 다음 화면으로) -->
  <button type="button" class="scroll-hint" id="scrollHint">
    <span>아래로 스크롤</span>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
