<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>러닝 코스 설문 · 트립 런닝</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- 폰트: Pretendard -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <!-- 공통 스타일 → 페이지 스타일 순서 유지 -->
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/survey.css" rel="stylesheet" />
</head>
<body class="survey-page overlay-header">
  <header id="site-header"></header>

  <!-- 배경 사진: 질문마다 바뀌고, 두 장을 겹쳐서 부드럽게 전환합니다 -->
  <div class="survey-bg" aria-hidden="true">
    <div class="survey-bg-layer is-active" id="bgA"></div>
    <div class="survey-bg-layer" id="bgB"></div>
  </div>

  <main class="survey-stage">
    <!-- 질문 카드 -->
    <section class="glass-card question-card" id="questionCard" aria-live="polite">
      <!-- 진행 상태: 러닝 코스 모양 진행선 + '3 / 10' -->
      <div class="survey-progress">
        <div class="route-line" aria-hidden="true">
          <div class="route-line-fill" id="progressFill"></div>
          <div class="route-runner" id="progressRunner"></div>
        </div>
        <span class="progress-count" id="progressCount">1 / 10</span>
      </div>

      <div id="questionBody"></div>

      <div class="question-footer">
        <button type="button" class="btn-ghost" id="prevBtn">이전</button>
        <button type="button" class="btn-next d-none" id="nextBtn">다음</button>
      </div>
    </section>

    <!-- 분석 중 화면 (마지막 질문 뒤에 잠깐 표시) -->
    <section class="glass-card analyzing d-none" id="analyzing" aria-live="polite">
      <div class="analyzing-route" aria-hidden="true">
        <svg viewBox="0 0 240 80" width="240" height="80">
          <path class="analyzing-path-bg" d="M10 60 C 50 10, 90 10, 120 40 S 190 75, 230 20" />
          <path class="analyzing-path" d="M10 60 C 50 10, 90 10, 120 40 S 190 75, 230 20" />
        </svg>
      </div>
      <h2 class="analyzing-title">나만의 러닝 코스를 만드는 중이에요</h2>
      <p class="analyzing-step" id="analyzingStep">여행지 정보를 정리하는 중…</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/survey.js"></script>
</body>
</html>
