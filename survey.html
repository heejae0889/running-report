<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>러닝 코스 설문 · 트립 런닝</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/survey.css" rel="stylesheet" />
</head>
<body class="survey-page overlay-header">
  <header id="site-header"></header>
  <div class="survey-bg" aria-hidden="true">
    <div class="survey-bg-layer is-active" id="bgA"></div>
    <div class="survey-bg-layer" id="bgB"></div>
  </div>

  <main class="survey-stage">
    <section class="glass-card question-card" id="questionCard" aria-live="polite">
      <div class="survey-progress">
        <div class="route-line" aria-hidden="true">
          <div class="route-line-fill" id="progressFill"></div>
          <div class="route-runner" id="progressRunner"></div>
        </div>
        <span class="progress-count" id="progressCount">1 / 10</span>
      </div>

      <div id="questionBody"></div>

      <div class="question-footer">
        <button type="button" class="btn-ghost" id="prevBtn">이전</button>
        <button type="button" class="btn-next d-none" id="nextBtn">다음</button>
      </div>
    </section>

    <section class="glass-card analyzing d-none" id="analyzing" aria-live="polite">
      <div class="analyzing-route" aria-hidden="true">
        <svg viewBox="0 0 260 90" width="260" height="90">
          <path class="analyzing-path-bg" d="M14 66 C 54 14, 94 14, 126 46 S 200 82, 246 22" />
          <path class="analyzing-path" id="analyzingPath" d="M14 66 C 54 14, 94 14, 126 46 S 200 82, 246 22" />
          <circle class="analyzing-runner" id="analyzingRunner" r="7" cx="14" cy="66" />
          <circle class="analyzing-goal" r="5" cx="246" cy="22" />
        </svg>
      </div>
      <h2 class="analyzing-title">나만의 러닝 코스를 만드는 중이에요</h2>
      <div class="analyzing-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="analyzingBar">
        <div class="analyzing-bar-fill" id="analyzingFill"></div>
      </div>
      <p class="analyzing-percent"><b id="analyzingPercent">0</b>%</p>
      <ol class="analyzing-steps" id="analyzingSteps">
        <li data-step="plan">Ai페이스메이커가 코스를 구상해요</li>
        <li data-step="place">들를 곳의 위치를 찾아요</li>
        <li data-step="route">실제 걷는 길을 계산해요</li>
        <li data-step="done">레포트를 준비해요</li>
      </ol>
      <p class="analyzing-step" id="analyzingStep">여행지 정보를 정리하는 중…</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/secrets.js"></script>
  <script src="js/common.js"></script>
  <script src="js/course-ai.js"></script>
  <script src="js/survey.js"></script>
</body>
</html>
