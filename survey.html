<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>러닝 코스 설문 · 트립 런닝</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- 폰트: Pretendard -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <!-- 공통 스타일 → 페이지 스타일 순서 유지 -->
  <link href="css/common.css" rel="stylesheet" />
  <link href="css/survey.css" rel="stylesheet" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container survey-wrap">
    <!-- 상단 제목 -->
    <section class="survey-head text-center">
      <h1 class="survey-title">러닝 코스 찾기</h1>
      <p class="survey-sub">몇 가지 질문에 답하면 나만의 러닝 레포트를 만들어 드려요.</p>
    </section>

    <!-- 진행 상태: '1 / 7' + 진행바 -->
    <section class="survey-progress" id="progressArea">
      <span class="progress-count"><b id="currentNum">1</b> / <span id="totalNum">7</span></span>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- 질문 카드: survey.js가 질문마다 내용을 바꿔 끼웁니다 -->
    <section class="question-card card-soft" id="questionCard">
      <div id="questionBody"></div>

      <div class="question-footer">
        <button type="button" class="btn btn-outline-prev" id="prevBtn">‹ 이전</button>
        <button type="button" class="btn btn-navy btn-next d-none" id="nextBtn">다음 ›</button>
      </div>
    </section>

    <!-- 분석 중 화면 (마지막 질문 뒤에 잠깐 표시) -->
    <section class="analyzing card-soft d-none" id="analyzing">
      <div class="runner" aria-hidden="true">🏃</div>
      <h2 class="analyzing-title">맞춤 레포트를 만드는 중이에요</h2>
      <p class="analyzing-step" id="analyzingStep">코스를 고르는 중…</p>
      <div class="progress-track mt-3"><div class="progress-fill analyzing-fill"></div></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/survey.js"></script>
</body>
</html>
